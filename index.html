      quizData.forEach((q, qIndex) => {
        // Create question block
        const block = document.createElement("div");
        block.className = "question-block";

        // Add question text
        const title = document.createElement("div");
        title.className = "question-text";
        title.innerText = q.question;
        block.appendChild(title);

        // Add options container
        const optionsDiv = document.createElement("div");
        optionsDiv.className = "options-container";

        // Feedback text below options
        const feedback = document.createElement("div");
        feedback.className = "feedback";

        // Generate buttons for choices
        const buttons = [];
        q.options.forEach((optText, optIndex) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.innerText = optText;

          btn.onclick = () => {
            // Disable all buttons in this question once answered
            buttons.forEach((b) => (b.disabled = true));

            if (optIndex === q.correctAnswerIndex) {
              btn.classList.add("correct");
              feedback.style.color = "#28a745";
              feedback.innerText = "Correct!";
            } else {
              btn.classList.add("wrong");
              buttons[q.correctAnswerIndex].classList.add("correct"); // Reveal right answer
              feedback.style.color = "#dc3545";
              feedback.innerText =
                "Incorrect. The right answer is highlighted.";
            }
            feedback.style.display = "block";
          };

          buttons.push(btn);
          optionsDiv.appendChild(btn);
        });

        block.appendChild(optionsDiv);
        block.appendChild(feedback);
        quizContent.appendChild(block);
      });
